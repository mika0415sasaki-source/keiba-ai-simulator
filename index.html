<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIBA AI Simulator v198</title>
<meta name="theme-color" content="#161b22">
</head>
<body style="margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<div id="boot" style="padding:24px;font-size:14px">KEIBA AI Simulator v198 を読み込み中…</div>
<script>
(async function(){
  try{
    let src=await fetch('./v196-live.html?v=196stable',{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('v196 stable HTTP '+r.status);
      return r.text();
    });

    src=src.replaceAll('KEIBA AI Simulator v196','KEIBA AI Simulator v198');
    src=src.replaceAll('③-v196','③-v198');

    const needle='    document.open();\n    document.write(outer);';
    const replacement=[
      "    outer=outer.replace('</body>','<script src=\"./race-meta-guard-v198.js?v=198\"></scr'+'ipt></body>');",
      '',
      '    document.open();',
      '    document.write(outer);'
    ].join('\n');
    if(!src.includes(needle))throw new Error('v198 guard insertion point not found');
    src=src.replace(needle,replacement);

    document.open();
    document.write(src);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<b>v198の読み込みに失敗しました。</b><br><br>'+String(err&&err.message?err.message:err)+'<br><br>ページを再読み込みしてください。';
    console.error(err);
  }
})();
</script>
</body>
</html>
