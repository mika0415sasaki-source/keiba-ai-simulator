<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIBA AI Simulator v175</title>
<meta name="theme-color" content="#161b22">
</head>
<body style="margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<div id="boot" style="padding:24px;font-size:14px">KEIBA AI Simulator v175 を読み込み中…</div>
<script>
(async function(){
  try{
    let src=await fetch('./v171.html?v=171',{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('v171 source HTTP '+r.status);
      return r.text();
    });

    const runtimeV175=`
<script>
(function(){
  let diagObserverV175=null;
  let diagTargetV175=null;
  let busyV175=false;

  function realErrorV175(s){
    return /HTTP|429|タイムアウト|timeout|取得失敗|network|通信|rate limit/i.test(String(s||''));
  }

  function getDiagV175(){
    let el=document.getElementById('jraEntryStatus');
    if(el)return el;
    const all=Array.from(document.querySelectorAll('div,section,pre'));
    return all.find(x=>/5走未満[:：]/.test(String(x.textContent||''))&&/race_id/.test(String(x.textContent||'')))||null;
  }

  function youngRaceByCareerV175(el){
    const txt=String(el&&el.textContent||'');
    const hs=(typeof horses!=='undefined'&&Array.isArray(horses))?horses:[];
    const debut=(typeof currentRaceClassLabelV133!=='undefined')&&/新馬/.test(String(currentRaceClassLabelV133||''));
    if(debut)return true;
    if(hs.some(h=>Number(h&&h.age||0)===2))return true;

    const a=txt.search(/5走未満[:：]/);
    if(a<0)return false;
    let b=txt.length;
    const rest=txt.slice(a+1);
    const m=rest.search(/5走未満\\/未取得[:：]|race_id|拡張CSV/);
    if(m>=0)b=a+1+m;
    const seg=txt.slice(a,b);
    const counts=Array.from(seg.matchAll(/[（(](\\d+)走[）)]/g)).map(x=>Number(x[1]));
    const need=Math.max(2,Math.ceil(Math.max(1,hs.length)*0.6));
    return counts.length>=need&&counts.every(n=>n>=0&&n<=4);
  }

  function grayParentV175(node){
    let p=node&&node.parentElement;
    if(!p)return;
    if(p.tagName==='SPAN'||p.tagName==='B'||p.tagName==='SMALL')p.style.color='#8b949e';
  }

  function normalizeTextNodeV175(node){
    let s=String(node.nodeValue||'');
    if(!/5走未満/.test(s))return false;
    let changed=false;

    s=s.replace(/5走未満\\/未取得[:：]([^\\n\\r]*)/g,function(full,detail){
      changed=true;
      if(realErrorV175(detail))return '取得要確認: '+detail.trim();
      return '若駒キャリア正常: '+detail.trim()+'（少キャリア・正常）';
    });

    s=s.replace(/5走未満[:：]([^\\n\\r]*)/g,function(full,detail){
      changed=true;
      return '若駒キャリア正常: '+detail.trim();
    });

    if(changed){
      node.nodeValue=s;
      if(!realErrorV175(s))grayParentV175(node);
    }
    return changed;
  }

  function fixYoungDiagV175(){
    if(busyV175)return;
    busyV175=true;
    try{
      const el=getDiagV175();
      if(!el||!youngRaceByCareerV175(el))return;

      const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
      const nodes=[];
      let n;
      while((n=walker.nextNode()))nodes.push(n);
      nodes.forEach(normalizeTextNodeV175);

      if(!el.querySelector('[data-v175-note]')){
        const note=document.createElement('div');
        note.setAttribute('data-v175-note','1');
        note.style.color='#8b949e';
        note.style.marginBottom='4px';
        note.innerHTML='<b>v175：2歳・新馬戦の少キャリア診断を表示DOMで直接補正。1〜4戦や対象レース以前0走は正常扱いし、HTTP 429・タイムアウト等の実取得エラーだけ警告。</b>';
        el.insertBefore(note,el.firstChild);
      }
    }catch(e){
      console.error('v175 young diagnostic fix',e);
    }finally{
      busyV175=false;
    }
  }

  function armV175(){
    const el=getDiagV175();
    if(el&&el!==diagTargetV175){
      if(diagObserverV175)diagObserverV175.disconnect();
      diagTargetV175=el;
      diagObserverV175=new MutationObserver(function(){setTimeout(fixYoungDiagV175,0);});
      diagObserverV175.observe(el,{childList:true,subtree:true,characterData:true});
    }
    fixYoungDiagV175();
  }

  [0,80,200,450,900,1600,2800].forEach(ms=>setTimeout(armV175,ms));
  document.addEventListener('click',function(){setTimeout(armV175,120);},true);
})();
<\/script>`;

    if(src.includes('</body>'))src=src.replace('</body>',runtimeV175+'\n</body>');
    else src+=runtimeV175;

    src=src.replaceAll('KEIBA AI Simulator v171','KEIBA AI Simulator v175');
    src=src.replaceAll('③-v171','③-v175');

    document.open();
    document.write(src);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<b>v175の読み込みに失敗しました。</b><br><br>'+String(err&&err.message?err.message:err)+'<br><br>ページを再読み込みしてください。';
    console.error(err);
  }
})();
</script>
</body>
</html>
