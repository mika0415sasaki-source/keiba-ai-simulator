<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIBA AI Simulator v164</title>
<meta name="theme-color" content="#161b22">
</head>
<body style="margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<div id="boot" style="padding:24px;font-size:14px">KEIBA AI Simulator v164 を読み込み中…</div>
<script>
(async function(){
  try{
    let src=await fetch('./v163.html?v=163',{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('v163 source HTTP '+r.status);
      return r.text();
    });

    function required(oldText,newText,label){
      if(!src.includes(oldText)) throw new Error('patch target not found: '+label);
      src=src.replace(oldText,newText);
    }

    required(
      'g1.map(q=>q.h.no),g2.map(q=>q.h.no),g3.map(q=>q.h.no),28',
      'g1.map(q=>q.h.no),g2.map(q=>q.h.no),g3.map(q=>q.h.no),Infinity',
      'trifecta full formation'
    );

    const valueAnchor=[
      'best.calibration.coreDiagnosis>=medianCore-1.0;',
      '',
      '    txt+=`最高校正期待値:'
    ].join('\n');
    const valuePatch=[
      'best.calibration.coreDiagnosis>=medianCore-1.0;',
      '',
      '    const exclusionReasons=[];',
      '    if(best.ev<1.15) exclusionReasons.push(`EV ${best.ev.toFixed(2)}＜1.15`);',
      "    if(!best.calibration){",
      "      exclusionReasons.push('校正データなし');",
      '    }else{',
      '      if(best.calibration.consensus<.52) exclusionReasons.push(`信頼 ${(best.calibration.consensus*100).toFixed(0)}%＜52%`);',
      '      if(best.calibration.classBonus<-1.0) exclusionReasons.push(`相手レベル ${best.calibration.classBonus.toFixed(1)}＜-1.0`);',
      '      if(best.calibration.coreDiagnosis<medianCore-1.0) exclusionReasons.push(`総合診断 ${best.calibration.coreDiagnosis.toFixed(1)}＜${(medianCore-1.0).toFixed(1)}`);',
      '    }',
      "    const criteriaText=`EV ${best.ev.toFixed(2)}（基準≥1.15） / 信頼 ${best.calibration?(best.calibration.consensus*100).toFixed(0)+'%':'-'}（基準≥52%） / 相手レベル ${best.calibration?best.calibration.classBonus.toFixed(1):'-'}（基準≥-1.0） / 総合診断 ${best.calibration?best.calibration.coreDiagnosis.toFixed(1):'-'}（基準≥${(medianCore-1.0).toFixed(1)}）`;",
      '',
      '    txt+=`最高校正期待値:'
    ].join('\n');
    required(valueAnchor,valuePatch,'value diagnostic');

    required(
      ': \'<span style="margin-left:6px;opacity:.75">※期待値上位だが買い候補基準外</span>\'',
      ': \'<span style="margin-left:6px;opacity:.75">※期待値上位だが買い候補基準外</span><br><span style="opacity:.75">判定: \'+criteriaText+\'</span><br><span style="opacity:.9">除外理由: \'+(exclusionReasons.join(\' / \')||\'買い候補基準未達\')+\'</span>\'',
      'value exclusion reason'
    );

    src=src.replace('KEIBA AI Simulator v163</h1>','KEIBA AI Simulator v164</h1>');
    src=src.replace('<title>KEIBA AI Safari v51</title>','<title>KEIBA AI Simulator v164</title>');

    document.open();
    document.write(src);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<b>v164の読み込みに失敗しました。</b><br><br>'+String(err && err.message ? err.message : err)+'<br><br>ページを再読み込みしてください。';
    console.error(err);
  }
})();
</script>
</body>
</html>
