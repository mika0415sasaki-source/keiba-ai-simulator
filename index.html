  function frameFromNoV187(no,n){
    no=Number(no); n=Number(n);

    if(n<=8)return no;
    const base=Math.floor(n/8),rem=n%8;

    return 0;

      return (typeof horses!=='undefined'&&Array.isArray(horses))?horses.filter(h=>h&&h.name):[];
    }catch(e){return [];}
  }

  function numbersAreFinalV187(hs){
    if(!Array.isArray(hs)||hs.length<3||hs.length>18)return false;
    const nums=hs.map(h=>Number(h&&h.no)).sort((a,b)=>a-b);
    return !nums.some((x,i)=>!Number.isInteger(x)||x!==i+1);
  }

  function applyFramesCoreV187(doRerender){
    if(frameBusyV187)return false;
    const hs=currentHorsesV187();
    if(!numbersAreFinalV187(hs))return false;
    const n=hs.length;
    const mapped=hs.map(h=>({h,frame:frameFromNoV187(h.no,n)}));
    if(mapped.some(x=>x.frame<1||x.frame>8))return false;

      window.__keibaFrameConfirmedV167=true;

    if(condition)pieces.push('条件 '+condition.replace(/\s*\/.*$/,''));
    if(grade)pieces.push('格 '+grade.replace(/\s*\/.*$/,''));
    if(recent)pieces.push('近走 '+recent.replace(/\s*\/.*$/,''));
    if(applyFramesCoreV187(false))pieces.push('枠順確定・枠補正ON');
    return pieces.join(' ｜ ')||'取得状況';
  }

  function compactLogV187(){
    const st=document.getElementById('jraEntryStatus');
    if(!st)return;

    let details=document.getElementById('jraEntryStatusDetailsV187');
    let summaryLine=document.getElementById('jraEntryCompactV187');

    if(!details){

      if(!parent)return;
      summaryLine=document.createElement('div');
      summaryLine.id='jraEntryCompactV187';

      sum.style.cssText='cursor:pointer;padding:9px 10px;color:#8b949e;font-weight:700';
      details.appendChild(sum);

      parent.insertBefore(details,st);

          if(typeof lastStats!=='undefined')lastStats=null;
          if(typeof renderStats==='function'&&!rerenderingV187){
