<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIBA AI Simulator v185</title>
<meta name="theme-color" content="#161b22">
</head>
<body style="margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<div id="boot" style="padding:24px;font-size:14px">KEIBA AI Simulator v185 を読み込み中…</div>
<script>
(async function(){
  try{
    let outer=await fetch('./v181.html?v=181',{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('v181 source HTTP '+r.status);
      return r.text();
    });

    // 取得ログは静的details内へ入れる。既存の取込・メモリ処理には触れない。
    const staticPatchV185=[
      "    required(",
      "      '<div id=\"jraEntryStatus\" class=\"small\" style=\"margin-top:5px\">JRA出馬表URL・netkeiba競馬新聞URLのどちらでも取込できます。URL欄へ貼り付けて「出馬表を取得」を押してください。</div>',",
      "      '<details id=\"jraEntryStatusDetails\" style=\"margin-top:7px;border:1px solid #30363d;border-radius:8px;background:#0d1117\"><summary style=\"cursor:pointer;padding:9px 10px;color:#8b949e;font-weight:700\">取得状況・詳細ログ（タップで表示）</summary><div id=\"jraEntryStatus\" class=\"small\" style=\"margin:0;padding:0 10px 10px;white-space:normal\">JRA出馬表URL・netkeiba競馬新聞URLのどちらでも取込できます。URL欄へ貼り付けて「出馬表を取得」を押してください。</div></details>',",
      "      'v185 static collapse entry diagnostics'",
      "    );"
    ].join("\n");

    const insertNeedle='wrapper=wrapper.slice(0,at)+"\\n"+precisionPatchV178+wrapper.slice(at);';
    if(!outer.includes(insertNeedle))throw new Error('v185 static status insertion point not found');
    const insertReplacement='wrapper=wrapper.slice(0,at)+"\\n"+precisionPatchV178+"\\n"+'+JSON.stringify(staticPatchV185)+'+wrapper.slice(at);';
    outer=outer.replace(insertNeedle,insertReplacement);

    // v185: 枠順補正だけを独立JSで追加。DOM・メモリ・取込本体は一切移動しない。
    const runtimeV185=`
(function(){
  try{
    if(document.getElementById('frameV185Script'))return;
    var s=document.createElement('script');
    s.id='frameV185Script';
    s.src='./frame-v185.js?v=185';
    s.async=true;
    (document.head||document.documentElement).appendChild(s);
  }catch(e){console.warn('v185 frame helper load failed',e);}
})();
`;

    const runtimeStart=outer.indexOf('    const runtimeV181=`');
    const runtimeAnchor=outer.indexOf('    const runtimeAnchorV181=',runtimeStart);
    if(runtimeStart<0||runtimeAnchor<0)throw new Error('v185 runtime insertion point not found');
    outer=outer.slice(0,runtimeStart)+'    const runtimeV181='+JSON.stringify(runtimeV185)+';\n\n'+outer.slice(runtimeAnchor);

    outer=outer.replace('<title>KEIBA AI Simulator v181</title>','<title>KEIBA AI Simulator v185</title>');
    outer=outer.replace('KEIBA AI Simulator v181 を読み込み中…','KEIBA AI Simulator v185 を読み込み中…');
    outer=outer.replace("replaceAll('KEIBA AI Simulator v171','KEIBA AI Simulator v181')","replaceAll('KEIBA AI Simulator v171','KEIBA AI Simulator v185')");
    outer=outer.replace("replaceAll('③-v171','③-v181')","replaceAll('③-v171','③-v185')");
    outer=outer.replace(/v181の読み込みに失敗しました。/g,'v185の読み込みに失敗しました。');

    document.open();
    document.write(outer);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<b>v185の読み込みに失敗しました。</b><br><br>'+String(err&&err.message?err.message:err)+'<br><br>ページを再読み込みしてください。';
    console.error(err);
  }
})();
</script>
</body>
</html>
