<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIBA AI Simulator v214</title>
<meta name="theme-color" content="#161b22">
<style>
html,body{margin:0;width:100%;height:100%;background:#0d1117;overflow:hidden}
#app{border:0;width:100%;height:100%;display:block;background:#0d1117}
#boot{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:140px;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;z-index:5}
</style>
</head>
<body>
<div id="boot">KEIBA AI Simulator v214 を読み込み中…</div>
<iframe id="app" src="./v196-live.html?v=196stable"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  const boot=document.getElementById('boot');
  let injected=false;

  function renameVersion(d,w){
    try{
      d.title='KEIBA AI Simulator v214';
      const walker=d.createTreeWalker(d.body,w.NodeFilter.SHOW_TEXT);
      let n;
      while((n=walker.nextNode())){
        if(String(n.nodeValue||'').includes('KEIBA AI Simulator v196')){
          n.nodeValue=String(n.nodeValue).replaceAll('KEIBA AI Simulator v196','KEIBA AI Simulator v214');
        }
      }
    }catch(e){}
  }

  function loadScript(d,src,onload,onerror){
    const s=d.createElement('script');
    s.src=src;
    s.onload=onload;
    s.onerror=onerror;
    d.body.appendChild(s);
  }

  function inject(){
    if(injected)return;
    try{
      const w=frame.contentWindow;
      const d=frame.contentDocument||w.document;
      if(!d||!d.body||!d.getElementById('fetchJraEntry'))return false;
      renameVersion(d,w);
      loadScript(d,'./race-meta-guard-v214.js?v=214',function(){
        loadScript(d,'./storage-maintenance-v206.js?v=214',function(){
          loadScript(d,'./bet-plan-v207.js?v=214',function(){
            loadScript(d,'./display-cleanup-v201.js?v=214',function(){
              injected=true;
              renameVersion(d,w);
              if(boot)boot.style.display='none';
            },function(){
              if(boot)boot.textContent='v214 表示整理処理の読み込みに失敗しました。ページを再読み込みしてください。';
            });
          },function(){
            if(boot)boot.textContent='v214 買い目処理の読み込みに失敗しました。ページを再読み込みしてください。';
          });
        },function(){
          if(boot)boot.textContent='v214 保存容量保護処理の読み込みに失敗しました。ページを再読み込みしてください。';
        });
      },function(){
        if(boot)boot.textContent='v214 条件確認処理の読み込みに失敗しました。ページを再読み込みしてください。';
      });
      return true;
    }catch(e){
      return false;
    }
  }

  frame.addEventListener('load',function(){
    let tries=0;
    const timer=setInterval(function(){
      tries++;
      if(inject()||tries>80)clearInterval(timer);
    },120);
  });

  let tries=0;
  const timer=setInterval(function(){
    tries++;
    if(inject()||tries>120){
      clearInterval(timer);
      if(!injected&&boot)boot.textContent='v214の起動に時間がかかっています。ページを再読み込みしてください。';
    }
  },150);
})();
</script>
</body>
</html>
