<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIBA AI Simulator v231</title>
<meta name="theme-color" content="#161b22">
<style>
html,body{margin:0;width:100%;height:100%;background:#0d1117;overflow:hidden}
#app{border:0;width:100%;height:100%;display:block;background:#0d1117}
#boot{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:140px 18px 0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;text-align:center;z-index:5}
</style>
</head>
<body>
<div id="boot">KEIBA AI Simulator v231 を読み込み中…</div>
<iframe id="app" src="./v231-live.html?v=231"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('app');
  const boot=document.getElementById('boot');
  let started=false;
  let ready=false;

  function renameVersion(d,w){
    try{
      d.title='KEIBA AI Simulator v231';
      const walker=d.createTreeWalker(d.body,w.NodeFilter.SHOW_TEXT);
      let n;
      while((n=walker.nextNode())){
        const s=String(n.nodeValue||'');
        if(s.includes('KEIBA AI Simulator v196'))n.nodeValue=s.replaceAll('KEIBA AI Simulator v196','KEIBA AI Simulator v231');
      }
    }catch(e){}
  }

  function loadScript(d,src){
    return new Promise(function(resolve){
      try{
        const s=d.createElement('script');
        s.src=src;
        s.async=true;
        s.onload=function(){resolve(true);};
        s.onerror=function(){console.warn('helper script failed:',src);resolve(false);};
        d.body.appendChild(s);
      }catch(e){resolve(false);}
    });
  }

  async function start(){
    if(started)return true;
    try{
      const w=frame.contentWindow;
      const d=frame.contentDocument||w.document;
      if(!d||!d.body||!d.getElementById('fetchJraEntry'))return false;
      started=true;
      renameVersion(d,w);
      ready=true;
      if(boot)boot.style.display='none';

      await loadScript(d,'./remote-storage-v216.js?v=231');
      await loadScript(d,'./runtime-v224.js?v=231');
      await loadScript(d,'./learning-stats-v223.js?v=231');

      renameVersion(d,w);
      return true;
    }catch(e){
      started=false;
      return false;
    }
  }

  function waitForCore(){
    let tries=0;
    function tick(){
      tries++;
      Promise.resolve(start()).then(function(ok){
        if(ok)return;
        if(tries<100)return setTimeout(tick,120);
        if(!ready&&boot)boot.innerHTML='v231本体の起動を確認できませんでした。<br>Safariを再読み込みしてください。';
      });
    }
    tick();
  }

  frame.addEventListener('load',waitForCore,{once:true});
  setTimeout(waitForCore,250);
})();
</script>
</body>
</html>
