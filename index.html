<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIBA AI Simulator v215</title>
<meta name="theme-color" content="#161b22">
<style>
html,body{margin:0;width:100%;height:100%;background:#0d1117;overflow:hidden}
#app{border:0;width:100%;height:100%;display:block;background:#0d1117}
#boot{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:140px 18px 0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;text-align:center;z-index:5}
</style>
</head>
<body>
<div id="boot">KEIBA AI Simulator v215 を読み込み中…</div>
<iframe id="app" src="./v196-live.html?v=196stable"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('app');
  const boot=document.getElementById('boot');
  let started=false;
  let ready=false;

  function renameVersion(d,w){
    try{
      d.title='KEIBA AI Simulator v215';
      const walker=d.createTreeWalker(d.body,w.NodeFilter.SHOW_TEXT);
      let n;
      while((n=walker.nextNode())){
        const s=String(n.nodeValue||'');
        if(s.includes('KEIBA AI Simulator v196')){
          n.nodeValue=s.replaceAll('KEIBA AI Simulator v196','KEIBA AI Simulator v215');
        }
      }
    }catch(e){}
  }

  function optionalScript(d,src){
    return new Promise(function(resolve){
      try{
        const s=d.createElement('script');
        s.src=src;
        s.async=true;
        s.onload=function(){resolve(true);};
        s.onerror=function(){console.warn('optional script failed:',src);resolve(false);};
        d.body.appendChild(s);
      }catch(e){
        console.warn('optional script error:',src,e);
        resolve(false);
      }
    });
  }

  async function start(){
    if(started)return true;
    try{
      const w=frame.contentWindow;
      const d=frame.contentDocument||w.document;
      if(!d||!d.body||!d.getElementById('fetchJraEntry'))return false;
      started=true;

      // v215: 本体が起動した時点で操作可能にする。
      // 補助JSの失敗でアプリ全体を止めない。
      renameVersion(d,w);
      ready=true;
      if(boot)boot.style.display='none';

      // v214までの race-meta-guard は廃止。
      // window.fetch を横取りせず、v196本体の既存取得処理だけを使う。
      await Promise.all([
        optionalScript(d,'./storage-maintenance-v206.js?v=215'),
        optionalScript(d,'./bet-plan-v207.js?v=215'),
        optionalScript(d,'./display-cleanup-v201.js?v=215')
      ]);

      renameVersion(d,w);
      return true;
    }catch(e){
      started=false;
      return false;
    }
  }

  frame.addEventListener('load',function(){
    let tries=0;
    const timer=setInterval(function(){
      tries++;
      if(start()||tries>=100)clearInterval(timer);
    },100);
  });

  let tries=0;
  const timer=setInterval(function(){
    tries++;
    if(start()||tries>=160){
      clearInterval(timer);
      if(!ready&&boot){
        boot.innerHTML='v215本体の起動を確認できませんでした。<br>Safariを再読み込みしてください。';
      }
    }
  },100);
})();
</script>
</body>
</html>
