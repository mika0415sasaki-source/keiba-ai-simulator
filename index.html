<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIBA AI Simulator v173</title>
<meta name="theme-color" content="#161b22">
</head>
<body style="margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<div id="boot" style="padding:24px;font-size:14px">KEIBA AI Simulator v173 を読み込み中…</div>
<script>
(async function(){
  try{
    let src=await fetch('./v171.html?v=171',{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('v171 source HTTP '+r.status);
      return r.text();
    });

    function patch(oldText,newText,label){
      if(!src.includes(oldText))throw new Error('v173 patch target not found: '+label);
      src=src.replace(oldText,newText);
    }

    patch(
      "      '    const young=hs.filter(h=>Number(h&&h.age||0)===2||debut);',\n      '    if(!young.length)return;',",
      [
        "      \"    const bodyTextV172=String((document.body&&document.body.innerText)||'');\",",
        "      \"    const diagTextV172=String(el.textContent||'');\",",
        "      '    const runListV172=Array.from(diagTextV172.matchAll(/[（(](\\\\d+)走[）)]/g)).map(m=>Number(m[1]));',",
        "      '    const youngRaceV172=debut||hs.some(h=>Number(h&&h.age||0)===2)||/馬齢\\\\s*2歳|馬齢理由[:：]?\\\\s*2歳/.test(bodyTextV172)||(runListV172.length>=Math.max(2,Math.ceil(hs.length*0.6))&&runListV172.every(n=>n<=4));',",
        "      '    if(!youngRaceV172)return;',",
        "      '    const young=hs;',"
      ].join('\n'),
      'young race detection'
    );

    patch(
      "      \"    const issueText=plainParts.filter(t=>/^(?:5走未満\\\\/未取得|取得要確認)[:：]/.test(t)).join(' ');\",",
      "      \"    const issueText=plainParts.filter(t=>/^(?:5走未満\\\\/未取得|取得要確認)[:：]/.test(t)&&/HTTP|429|タイムアウト|timeout|取得失敗|network|通信|rate limit/i.test(t)).join(' ');\",",
      'real acquisition errors only'
    );

    patch(
      "      \"      if(/^5走未満\\\\/未取得[:：]/.test(t))return p.replace(/5走未満\\\\/未取得[:：]/,'取得要確認:');\",",
      [
        "      '      if(/^5走未満\\\\/未取得[:：]/.test(t)){',",
        "      '        const realErrorV172=/HTTP|429|タイムアウト|timeout|取得失敗|network|通信|rate limit/i.test(t);',",
        "      \"        if(realErrorV172)return p.replace(/5走未満\\\\/未取得[:：]/,'取得要確認:');\",",
        "      \"        if(/対象レース以前0走|[（(]0走[）)]/.test(t))return '<span style=\\\"color:#8b949e\\\">若駒キャリア正常: '+t.replace(/^5走未満\\\\/未取得[:：]\\\\s*/,'')+'（過去走なし・正常）</span>';\",",
        "      \"        return p.replace(/5走未満\\\\/未取得[:：]/,'取得要確認:');\",",
        "      '      }',"
      ].join('\n'),
      'zero-start is normal in young race'
    );

    patch(
      "      '// ---- /v171 runtime hooks ----',",
      [
        `      '',`,
        `      '// ---- v173 post-render young-race diagnostic rescan ----',`,
        `      'function kickYoungDiagV173(){',`,
        `      '  [0,80,250,700,1500].forEach(ms=>setTimeout(()=>{try{normalizeYoungCareerDiagV171();}catch(e){}},ms));',`,
        `      '}',`,
        `      "if(typeof MutationObserver!=='undefined'){",`,
        `      '  setTimeout(()=>{',`,
        `      '    const body=document.body;',`,
        `      '    if(body){',`,
        `      '      const obV173=new MutationObserver(()=>{',`,
        `      "        const el=(typeof jraEntryStatus!=='undefined'&&jraEntryStatus)?jraEntryStatus:document.getElementById('jraEntryStatus');",`,
        `      "        if(el&&/5走未満/.test(String(el.textContent||'')))kickYoungDiagV173();",`,
        `      '      });',`,
        `      '      obV173.observe(body,{childList:true,subtree:true,characterData:true});',`,
        `      '    }',`,
        `      '    kickYoungDiagV173();',`,
        `      '  },0);',`,
        `      '}',`,
        `      '// ---- /v173 post-render young-race diagnostic rescan ----',`,
        `      '// ---- /v171 runtime hooks ----',`
      ].join('\n'),
      'post-render young diagnostic rescan'
    );

    src=src.replace('KEIBA AI Simulator v171 を読み込み中…','KEIBA AI Simulator v173 を読み込み中…');
    src=src.replace("KEIBA AI Simulator v171</h1>","KEIBA AI Simulator v173</h1>");
    src=src.replaceAll('KEIBA AI Simulator v171</title>','KEIBA AI Simulator v173</title>');
    src=src.replaceAll('v171の読み込みに失敗','v173の読み込みに失敗');
    src=src.replaceAll('③-v171','③-v173');
    src=src.replace(
      "'<b>v171：新馬・2歳戦の診断表示を整理。",
      "'<b>v173：若駒診断をAI描画後にも再判定。2歳表記が後から描画された場合でも「5走未満」を正常な少キャリア表示へ置換する。</b><br>'+\\n    '<b>v172：2歳戦の診断判定を強化。馬データ年齢が空でも画面の2歳表記・少キャリア分布から若駒戦を認識し、対象レース以前0走は正常扱い。実通信エラーだけ取得要確認として残す。</b><br>'+\\n    '<b>v171：新馬・2歳戦の診断表示を整理。"
    );

    document.open();
    document.write(src);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<b>v173の読み込みに失敗しました。</b><br><br>'+String(err&&err.message?err.message:err)+'<br><br>ページを再読み込みしてください。';
    console.error(err);
  }
})();
</script>
</body>
</html>
