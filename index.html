<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIBA AI Simulator v166</title>
<meta name="theme-color" content="#161b22">
</head>
<body style="margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<div id="boot" style="padding:24px;font-size:14px">KEIBA AI Simulator v166 を読み込み中…</div>
<script>
(async function(){
  try{
    let src=await fetch('./v163.html?v=163',{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('v163 source HTTP '+r.status);
      return r.text();
    });

    function required(oldText,newText,label){
      if(!src.includes(oldText)) throw new Error('patch target not found: '+label);
      src=src.replace(oldText,newText);
    }

    // v164: 3連複フォーメーションを表示どおり全点生成。
    required(
      'g1.map(q=>q.h.no),g2.map(q=>q.h.no),g3.map(q=>q.h.no),28',
      'g1.map(q=>q.h.no),g2.map(q=>q.h.no),g3.map(q=>q.h.no),Infinity',
      'trifecta full formation'
    );

    // v164: 妙味判定の基準外理由を数値で表示。
    const valueAnchor=[
      'best.calibration.coreDiagnosis>=medianCore-1.0;',
      '',
      '    txt+=`最高校正期待値:'
    ].join('\n');
    const valuePatch=[
      'best.calibration.coreDiagnosis>=medianCore-1.0;',
      '',
      '    const exclusionReasons=[];',
      '    if(best.ev<1.15) exclusionReasons.push(`EV ${best.ev.toFixed(2)}＜1.15`);',
      "    if(!best.calibration){",
      "      exclusionReasons.push('校正データなし');",
      '    }else{',
      '      if(best.calibration.consensus<.52) exclusionReasons.push(`信頼 ${(best.calibration.consensus*100).toFixed(0)}%＜52%`);',
      '      if(best.calibration.classBonus<-1.0) exclusionReasons.push(`相手レベル ${best.calibration.classBonus.toFixed(1)}＜-1.0`);',
      '      if(best.calibration.coreDiagnosis<medianCore-1.0) exclusionReasons.push(`総合診断 ${best.calibration.coreDiagnosis.toFixed(1)}＜${(medianCore-1.0).toFixed(1)}`);',
      '    }',
      "    const criteriaText=`EV ${best.ev.toFixed(2)}（基準≥1.15） / 信頼 ${best.calibration?(best.calibration.consensus*100).toFixed(0)+'%':'-'}（基準≥52%） / 相手レベル ${best.calibration?best.calibration.classBonus.toFixed(1):'-'}（基準≥-1.0） / 総合診断 ${best.calibration?best.calibration.coreDiagnosis.toFixed(1):'-'}（基準≥${(medianCore-1.0).toFixed(1)}）`;",
      '',
      '    txt+=`最高校正期待値:'
    ].join('\n');
    required(valueAnchor,valuePatch,'value diagnostic');

    required(
      ': \'<span style="margin-left:6px;opacity:.75">※期待値上位だが買い候補基準外</span>\'',
      ': \'<span style="margin-left:6px;opacity:.75">※期待値上位だが買い候補基準外</span><br><span style="opacity:.75">判定: \'+criteriaText+\'</span><br><span style="opacity:.9">除外理由: \'+(exclusionReasons.join(\' / \')||\'買い候補基準未達\')+\'</span>\'',
      'value exclusion reason'
    );

    // v165: netkeiba出馬表で「枠順が本当に掲載されている」証拠を確認。
    // 仮の馬番→自動枠換算は表示用に残すが、採点には使わない。
    required(
      "const raceDate=targetRaceDateV118(raceId,src.text,shutuba.text||'');",
      [
        "const raceDate=targetRaceDateV118(raceId,src.text,shutuba.text||'');",
        "  const frameProbeV165=String((shutuba&&shutuba.text)||src.text||'');",
        "  const frameMarkerCountV165=(frameProbeV165.match(/(?:!\\[Image[^\\]]*:\\s*枠[1-8](?:白|黒|赤|青|黄|緑|橙|桃)?\\]|\\/waku\\/[1-8]\\.png)/g)||[]).length;",
        "  let frameNameHitsV165=0;",
        "  for(const fhV165 of (parsed||[])){",
        "    const nmV165=String(fhV165&&fhV165.name||'').trim();",
        "    const atV165=nmV165?frameProbeV165.indexOf(nmV165):-1;",
        "    if(atV165<0)continue;",
        "    const preV165=frameProbeV165.slice(Math.max(0,atV165-900),atV165);",
        "    if(/(?:!\\[Image[^\\]]*:\\s*枠[1-8](?:白|黒|赤|青|黄|緑|橙|桃)?\\]|\\/waku\\/[1-8]\\.png)/.test(preV165))frameNameHitsV165++;",
        "  }",
        "  const frameConfirmedV165=frameMarkerCountV165>=2&&frameNameHitsV165>=Math.min(2,Math.max(1,(parsed||[]).length));",
        "  (parsed||[]).forEach(h=>{h.frameConfirmedV165=frameConfirmedV165;});"
      ].join('\n'),
      'frame confirmation'
    );

    // v166: 後続の補完処理で馬オブジェクトが作り直されても、枠確定状態を最終parsedへ再付与。
    required(
      "setCurrentRaceContextV152(raceId,raceDate,raceMetaV147);\n\n  E.bulk.value=compactHorseCsv(parsed);\n  horses=parsed.slice(0,18).filter(h=>h&&h.name);",
      "setCurrentRaceContextV152(raceId,raceDate,raceMetaV147);\n\n  (parsed||[]).forEach(h=>{h.frameConfirmedV165=frameConfirmedV165;});\n  window.__keibaFrameConfirmedV166=frameConfirmedV165;\n  E.bulk.value=compactHorseCsv(parsed);\n  horses=parsed.slice(0,18).filter(h=>h&&h.name);",
      'final frame-state propagation'
    );

    // v165: 枠未確定ならシミュレーションのランダム内外バイアスも停止。
    required(
      "const frame=Number(h.frame||1);\n  const frameNorm=(frame-4.5)/3.5;\n  z+=scenario.frameBias*frameNorm;",
      "const frame=Number(h.frame||1);\n  const frameNorm=((h&&h.frameConfirmedV165===false)||((!h||h.frameConfirmedV165!==true)&&window.__keibaFrameConfirmedV166===false))?0:(frame-4.5)/3.5;\n  z+=scenario.frameBias*frameNorm;",
      'simulation frame bias'
    );

    // v165: コース専用補正内の内/外枠項目も、未確定時だけ無効化。
    required(
      "const f=Number(h&&h.frame||1);\n  const inside=f<=3, outer=f>=6;",
      "const f=Number(h&&h.frame||1);\n  const frameKnownV165=!((h&&h.frameConfirmedV165===false)||((!h||h.frameConfirmedV165!==true)&&window.__keibaFrameConfirmedV166===false));\n  const inside=frameKnownV165&&f<=3, outer=frameKnownV165&&f>=6;",
      'course frame bias'
    );

    // v165: 手動で枠を変更した場合は、その入力を確定枠として扱う。
    required(
      "h[k]=['name','style','no','jockey'].includes(k)?x.value:+x.value;\n   lastStats=null;renderStats();draw();",
      "h[k]=['name','style','no','jockey'].includes(k)?x.value:+x.value;\n   if(k==='frame')h.frameConfirmedV165=true;\n   lastStats=null;renderStats();draw();",
      'manual frame confirmation'
    );

    // v165: 近5走が不足した馬の校正勝率は、データ量に応じてフィールド平均へ縮小。
    // 0走=35%, 1走=48%, 2走=61%, 3走=74%, 4走=87%, 5走=100%の履歴信頼度。
    required(
      "if(extremeLongshot&&verySharpRise)r.preCal=Math.min(r.preCal,r.pMarket*2.35);\n    else if(longshot&&sharpRise)r.preCal=Math.min(r.preCal,r.pMarket*3.00);\n  });",
      [
        "if(extremeLongshot&&verySharpRise)r.preCal=Math.min(r.preCal,r.pMarket*2.35);",
        "    else if(longshot&&sharpRise)r.preCal=Math.min(r.preCal,r.pMarket*3.00);",
        "",
        "    const historyCountV165=Math.min(5,(r.h.runs||[]).length);",
        "    if(historyCountV165<5){",
        "      const historyConfidenceV165=.35+.13*historyCountV165;",
        "      r.historyCountV165=historyCountV165;",
        "      r.historyConfidenceV165=historyConfidenceV165;",
        "      r.preCal=historyConfidenceV165*r.preCal+(1-historyConfidenceV165)*(1/n);",
        "    }else{",
        "      r.historyCountV165=5;",
        "      r.historyConfidenceV165=1;",
        "    }",
        "  });"
      ].join('\n'),
      'history confidence shrink'
    );

    // v165: 診断欄にも枠確定状態を表示。
    required(
      "'<small>条件取得: '+(raceMetaV147.via||'race_id+header')+' / 馬場方針: '",
      "'<small>条件取得: '+(raceMetaV147.via||'race_id+header')+' / 枠順: '+(frameConfirmedV165?'確定・枠補正ON':'未確定・枠補正OFF')+' / 馬場方針: '",
      'frame status diagnostic'
    );

    // v165の更新内容を取込診断の先頭へ表示。
    required(
      "'<b>v163：新潟芝直線1000mのコース履歴を過去5走と分離",
      "'<b>v166：枠未確定フラグを最終出走馬へ再付与し、補完処理後に枠補正が復活する不具合を修正。</b><br>'+\n    '<b>v165：枠順未確定は枠補正を完全停止（総合診断・コース専用内外枠・シミュレーション枠バイアス）。近5走不足は自動再試行し、残った不足分は履歴信頼度で校正勝率を保守化。</b><br>'+\n    '<b>v163：新潟芝直線1000mのコース履歴を過去5走と分離",
      'v165 changelog'
    );

    // v165 runtime hooks:
    // 1) 枠補正0.0
    // 2) 近5走の不足馬だけ自動再試行
    // 3) AI表示に履歴信頼度を明示
    const runtimeV165=[
      '',
      '// ---- v165 runtime hooks ----',
      'const __frameDetailV89_v165=frameDetailV89;',
      'frameDetailV89=function(h){',
      "  if((h&&h.frameConfirmedV165===false)||((!h||h.frameConfirmedV165!==true)&&window.__keibaFrameConfirmedV166===false))return {bonus:0,reason:'枠順未確定のため評価対象外（枠補正0.0）'};",
      '  return __frameDetailV89_v165(h);',
      '};',
      '',
      'const __calibrationNoteV140_v165=calibrationNoteV140;',
      'calibrationNoteV140=function(q){',
      '  const base=__calibrationNoteV140_v165(q);',
      '  const n=Math.min(5,((q&&q.h&&q.h.runs)||[]).length);',
      '  if(n>=5)return base;',
      '  const conf=Math.round((.35+.13*n)*100);',
      "  return base+' / 5走 '+n+'/5・履歴信頼 '+conf+'%（抑制）';",
      '};',
      '',
      'const __fetchNetkeibaPast5V118_v165=fetchNetkeibaPast5V118;',
      'fetchNetkeibaPast5V118=async function(jraUrl,parsed,explicitRaceDate){',
      '  const all=(parsed||[]).slice();',
      '  const first=await __fetchNetkeibaPast5V118_v165(jraUrl,all,explicitRaceDate);',
      '  const before=new Map(all.map(h=>[String(h.no),((first.byNo&&first.byNo.get(String(h.no)))||[]).length]));',
      '  const retryTargets=all.filter(h=>((first.byNo&&first.byNo.get(String(h.no)))||[]).length<5);',
      '  first.retryAttempted=retryTargets.length;',
      '  first.retryRecovered=0;',
      '  first.retryCompleted=0;',
      '  if(!retryTargets.length)return first;',
      "  try{if(typeof jraEntryStatus!=='undefined'&&jraEntryStatus)jraEntryStatus.textContent='③-v165 近5走不足 '+retryTargets.length+'頭を自動再試行中…';}catch(e){}",
      '  let second=null;',
      '  try{second=await __fetchNetkeibaPast5V118_v165(jraUrl,retryTargets,explicitRaceDate);}catch(e){second=null;}',
      '  if(second){',
      "    for(const key of ['byNo','historyByNo']){",
      '      const a=first[key],b=second[key];',
      '      if(a&&b&&typeof b.forEach===\'function\')b.forEach((v,k)=>{',
      '        const old=a.get(k)||[];',
      '        if((v||[]).length>old.length)a.set(k,v);',
      '      });',
      '    }',
      '    if(first.pedByNo&&second.pedByNo&&typeof second.pedByNo.forEach===\'function\')second.pedByNo.forEach((v,k)=>{',
      '      const old=first.pedByNo.get(k)||{};',
      "      first.pedByNo.set(k,{sire:old.sire||v.sire||'',damsire:old.damsire||v.damsire||'',sex:old.sex||v.sex||'',age:Number(old.age||v.age||0),via:old.via||v.via||''});",
      '    });',
      '    first.cacheRecovered=(first.cacheRecovered||0)+(second.cacheRecovered||0);',
      '    first.cacheRecoveredRuns=(first.cacheRecoveredRuns||0)+(second.cacheRecoveredRuns||0);',
      '    first.networkFailed=(first.networkFailed||0)+(second.networkFailed||0);',
      '  }',
      '  first.totalRuns=0;first.withRuns=0;first.with5=0;',
      '  for(const h of all){',
      '    const no=String(h.no),rs=(first.byNo&&first.byNo.get(no))||[];',
      '    if(rs.length){first.withRuns++;first.totalRuns+=rs.length;if(rs.length>=5)first.with5++;}',
      '    const oldN=before.get(no)||0;',
      '    if(rs.length>oldN)first.retryRecovered++;',
      '    if(oldN<5&&rs.length>=5)first.retryCompleted++;',
      '  }',
      '  first.withPed=first.pedByNo&&typeof first.pedByNo.forEach===\'function\'?Array.from(first.pedByNo.values()).filter(v=>v&&(v.sire||v.damsire)).length:(first.withPed||0);',
      '  const still=all.filter(h=>((first.byNo&&first.byNo.get(String(h.no)))||[]).length<5);',
      "  first.via=(first.via||'newspaper-id>horse-db-v118')+' / v165-retry '+first.retryRecovered+'/'+first.retryAttempted+'改善';",
      "  first.error=still.length?'5走未満/未取得: '+still.map(h=>{const n=((first.byNo&&first.byNo.get(String(h.no)))||[]).length;return h.no+' '+h.name+'('+n+'走・再試行済)';}).join('・'):'';",
      '  return first;',
      '};',
      '// ---- /v165 runtime hooks ----',
      ''
    ].join('\n');

    const closeScript=src.lastIndexOf('<'+'/script>');
    if(closeScript<0)throw new Error('main script end not found');
    src=src.slice(0,closeScript)+runtimeV165+src.slice(closeScript);

    src=src.replace('KEIBA AI Simulator v163</h1>','KEIBA AI Simulator v166</h1>');
    src=src.replace('<title>KEIBA AI Safari v51</title>','<title>KEIBA AI Simulator v166</title>');

    document.open();
    document.write(src);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<b>v166の読み込みに失敗しました。</b><br><br>'+String(err && err.message ? err.message : err)+'<br><br>ページを再読み込みしてください。';
    console.error(err);
  }
})();
</script>
</body>
</html>
