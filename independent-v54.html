<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09101d">
<title>KEIBA AI 独自分析 v54</title>
<style>html,body{margin:0;min-height:100%;background:#09101d;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}#boot{padding:120px 24px;text-align:center;line-height:1.7}</style>
</head>
<body>
<div id="boot">KEIBA AI 独自分析 v54 を読み込み中…</div>
<script>
(async()=>{
  try{
    const parts=[];
    for(let i=0;i<8;i++){
      const r=await fetch(`./v54-parts/part${i}.txt?v=54b`,{cache:'no-store'});
      if(!r.ok)throw new Error(`part${i} ${r.status}`);
      parts.push(await r.text());
    }
    let html=parts.join('');
    html=html.replace('function auditStats(){const rows=Object.values(auditLoad()).filter(x=>x&&x.analyzed_at);const v=rows.filter(x=>x.verified);const h=v.filter(x=>x.hit===true || (x.hit==null&&x.trifecta_hit===true)).length;return {analyses:rows.length,verified:v.length,hits:h,rate:v.length?h/v.length*100:0}}}', 'function auditStats(){const rows=Object.values(auditLoad()).filter(x=>x&&x.analyzed_at);const v=rows.filter(x=>x.verified);const h=v.filter(x=>x.hit===true || (x.hit==null&&x.trifecta_hit===true)).length;return {analyses:rows.length,verified:v.length,hits:h,rate:v.length?h/v.length*100:0}}');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='v54の読み込みに失敗しました。<br>Safariを再読み込みしてください。<br><small>'+String(e)+'</small>';
  }
})();
</script>
</body>
</html>
