<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIBA AI Simulator v197 TEST</title>
<meta name="theme-color" content="#161b22">
<style>
html,body{margin:0;width:100%;height:100%;background:#0d1117;overflow:hidden}
#app{border:0;width:100%;height:100%;display:block;background:#0d1117}
#boot{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:140px;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;z-index:5}
</style>
</head>
<body>
<div id="boot">KEIBA AI Simulator v197 TEST を読み込み中…</div>
<iframe id="app" src="./index.html?v=196197test7"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  const boot=document.getElementById('boot');
  let injected=false;
  function inject(){
    if(injected)return;
    try{
      const w=frame.contentWindow;
      const d=frame.contentDocument||w.document;
      if(!d||!d.body)return;
      const s=d.createElement('script');
      s.src='./v197-test-runtime.js?v=197.6';
      s.onload=function(){
        const g=d.createElement('script');
        g.src='./v197-meta-fix.js?v=197.7';
        g.onload=function(){
          injected=true;
          if(boot)boot.style.display='none';
        };
        g.onerror=function(){
          if(boot)boot.textContent='v197 TEST条件確認処理の読み込みに失敗しました。v196本体は無傷です。';
        };
        d.body.appendChild(g);
      };
      s.onerror=function(){
        if(boot)boot.textContent='v197 TEST追加処理の読み込みに失敗しました。v196本体は無傷です。';
      };
      d.body.appendChild(s);
      setTimeout(function(){if(!injected&&boot)boot.style.display='none';},3000);
    }catch(e){
      if(boot)boot.textContent='v197 TESTの起動に失敗しました: '+String(e&&e.message||e);
    }
  }
  frame.addEventListener('load',function(){setTimeout(inject,120);});
  setTimeout(inject,1800);
})();
</script>
</body>
</html>
