<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09101d">
<title>KEIBA AI 独自分析 v56</title>
<style>html,body{margin:0;min-height:100%;background:#09101d;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}#boot{padding:120px 24px;text-align:center;line-height:1.7}</style>
</head>
<body>
<div id="boot">KEIBA AI 独自分析 v56 を読み込み中…</div>
<script>
(async()=>{
 try{
  const r=await fetch('./v55-parts/part0.txt?v=56a',{cache:'no-store'});
  if(!r.ok)throw new Error('本体 '+r.status);
  let html=await r.text();
  html=html.replaceAll('KEIBA AI 独自分析 v55','KEIBA AI 独自分析 v56').replaceAll('KEIBA_AI_Independent_v55','KEIBA_AI_Independent_v56');
  const patch=`<script>
  normDateKey=function(s){
    const t=String(s||'').trim().replace(/[./]/g,'-');
    let m=t.match(/(20\\d{2})[-年](\\d{1,2})[-月](\\d{1,2})(?:日)?/);
    if(m)return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
    m=t.match(/(?:^|\\D)(\\d{1,2})[-月](\\d{1,2})(?:日)?(?:$|\\D)/);
    if(m)return String(+m[1]).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0');
    return '';
  };
  sameRaceRow=function(a,b){
    if(!a||!b)return false;
    const da=normDateKey(a.date),db=normDateKey(b.date);
    if(da&&db&&da.slice(-5)!==db.slice(-5))return false;
    const ad=+a.distance||0,bd=+b.distance||0;
    if(ad&&bd&&ad!==bd)return false;
    return true;
  };
  validNetkeibaHistoryForHorse=function(h,rows){
    const nk=(rows||[]).filter(r=>!r.status),jra=(h.jra_history||[]).filter(r=>!r.status);
    if(!nk.length)return false;
    if(!jra.length)return true;
    for(const a of nk){for(const b of jra){if(sameRaceRow(a,b))return true;}}
    const age=+(String(h.sexage||h.age||h.sex_age||'').match(/\\d+/)?.[0]||0);
    const rd=raceDateFromUrl(document.getElementById('raceUrl')?.value||'');
    if(age===2&&rd){
      const y=+rd.slice(0,4),md=+rd.slice(4);
      const future=nk.some(r=>{
        const k=normDateKey(r.date);if(!k)return false;
        const p=k.split('-').map(Number);
        if(p.length===3)return p[0]===y&&(p[1]*100+p[2])>md;
        return (p[0]*100+p[1])>md;
      });
      if(future)return false;
    }
    return true;
  };
  <\/script>`;
  html=html.replace('</body>',patch+'</body>');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('boot').innerHTML='v56の読み込みに失敗しました。<br>Safariを再読み込みしてください。<br><small>'+String(e)+'</small>'}
})();
</script>
</body>
</html>
