<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09101d">
<title>KEIBA AI 独自分析</title>
<style>html,body{margin:0;min-height:100%;background:#09101d;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}#boot{padding:120px 24px;text-align:center;line-height:1.7}</style>
</head>
<body>
<div id="boot">KEIBA AI 独自分析を読み込み中…</div>
<script>
(async()=>{
 try{
  const r=await fetch('./v55-parts/part0.txt?v=restore-nk-20260901',{cache:'no-store'});
  if(!r.ok)throw new Error('本体 '+r.status);
  let html=await r.text();
  html=html.replace(/KEIBA AI 独自分析 v\d+/g,'KEIBA AI 独自分析')
           .replace(/KEIBA_AI_Independent_v\d+/g,'KEIBA_AI_Independent_current');
  const patch=`<script>
  loadNetkeibaHistories=async function({silent=false,force=false}={}){
   if(!horses.length){if(!silent)status('histStatus','先にJRA出馬表を取り込んでください。',true);return {ok:0,total:0}}
   const already=horses.filter(h=>(h.history||[]).length).length;
   if(!force&&already===horses.length){
    document.getElementById('histCount').textContent='netkeiba '+already+'/'+horses.length+'頭 / JRA照合 '+horses.filter(h=>(h.jra_history||[]).length).length+'頭';
    return {ok:already,total:horses.length};
   }
   try{
    if(!silent)status('histStatus','netkeiba馬DBから過去5走を再取得中…');
    const targets=force?horses:horses.filter(h=>!(h.history||[]).length);
    const j=await api('import_histories',{names:targets.map(h=>h.name),race_url:document.getElementById('raceUrl').value,target:{venue:document.getElementById('venue').value,distance:+document.getElementById('distance').value,going:document.getElementById('going').value}});
    for(const rr of j.results||[]){const h=horses.find(x=>x.name===rr.name);if(h){h.history=rr.history||[];h.histScores=rr.scores||null;h.netkeibaUrl=rr.url||null;h.netkeibaVia=rr.via||'';h.netkeibaError=rr.error||'';h.netkeibaRejected=false;mergeNetkeibaWithJra(h)}}
    const missing=horses.filter(h=>!(h.history||[]).length).map(h=>h.name);
    if(missing.length){
     try{
      const fb=await nkFallback(missing,document.getElementById('raceUrl').value);
      for(const rr of fb.results||[]){const h=horses.find(x=>x.name===rr.name);if(h&&rr.available){h.history=rr.history||[];h.histScores=rr.scores||h.histScores||null;h.netkeibaUrl=rr.url||null;h.netkeibaVia=rr.via||'fallback';h.netkeibaRejected=false;mergeNetkeibaWithJra(h)}}
     }catch(_){ }
    }
    for(const h of horses){if((h.history||[]).length&&!(h.histScores?.available)){h.histScores=scoreLocalHistory(h.history)}}
    renderHorses();
    const ok=horses.filter(h=>(h.history||[]).length).length;
    const jf=horses.filter(h=>!(h.history||[]).length&&(h.jra_history||[]).length).length;
    const fills=horses.reduce((n,h)=>n+(h.jraFillCount||0),0);
    document.getElementById('histCount').textContent='netkeiba '+ok+'/'+horses.length+'頭 / JRA照合 '+horses.filter(h=>(h.jra_history||[]).length).length+'頭';
    if(!silent)status('histStatus','netkeiba '+ok+'頭取得。JRA照合で'+fills+'項目を補完。'+(jf?jf+'頭はJRA4走を主データとして使用します。':''));
    refreshMemoryStats();
    return {ok,total:horses.length};
   }catch(e){
    const jf=horses.filter(h=>(h.jra_history||[]).length).length;
    if(!silent)status('histStatus','netkeiba取得失敗。JRA前4走で'+jf+'頭を補完します。',jf===0);
    renderHorses();
    return {ok:horses.filter(h=>(h.history||[]).length).length,total:horses.length,error:e};
   }
  };
  mergedCareerStats=function(){
    const m=syncCareerRaceMapFromAudit();
    const rows=Object.values(m).filter(x=>x&&x.analyzed);
    const localA=rows.length,localV=rows.filter(x=>x.verified).length,localH=rows.filter(x=>x.verified&&x.hit).length;
    const remoteA=Number(memoryStats?.predictions||0),remoteV=Number(memoryStats?.verified_predictions||0),remoteH=Number(memoryStats?.hit_predictions||0);
    const useRemote=remoteA>0;
    const analyses=useRemote?remoteA:localA;
    const verified=useRemote?Math.min(analyses,remoteV):localV;
    const hits=useRemote?Math.min(verified,remoteH):localH;
    const merged={analyses,verified,hits,rate:verified?hits/verified*100:0,updated_at:new Date().toISOString()};
    careerStatsSave(merged);return merged;
  };
  <\/script>`;
  html=html.replace('</body>',patch+'</body>');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('boot').innerHTML='読み込みに失敗しました。<br>Safariを再読み込みしてください。<br><small>'+String(e)+'</small>'}
})();
</script>
</body>
</html>
