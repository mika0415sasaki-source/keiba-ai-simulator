<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09101d">
<title>KEIBA AI 独自分析</title>
<style>html,body{margin:0;min-height:100%;background:#09101d;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}#boot{padding:120px 24px;text-align:center;line-height:1.7}</style>
</head>
<body>
<div id="boot">KEIBA AI 独自分析を読み込み中…</div>
<script>
(async()=>{
 try{
  const r=await fetch('./v55-parts/part0.txt?v=restore-nk-fast-20260901b',{cache:'no-store'});
  if(!r.ok)throw new Error('本体 '+r.status);
  let html=await r.text();
  html=html.replace(/KEIBA AI 独自分析 v\d+/g,'KEIBA AI 独自分析')
           .replace(/KEIBA_AI_Independent_v\d+/g,'KEIBA_AI_Independent_current');
  const patch=`<script>
  function memoryRunToHistory(r){
    if(!r)return null;
    const passage=Array.isArray(r.passage)?r.passage:String(r.corners||'').split('-').map(Number).filter(Number.isFinite);
    return {
      date:r.date||'', venue:r.venue||r.course||'', surface:r.surface||'',
      distance:+(r.distance??r.dist)||0, going:r.going||'', rank:+(r.rank??r.pos)||0,
      last3f:Number.isFinite(+(r.last3f??r.last3))?+(r.last3f??r.last3):null,
      jockey:r.jockey||'', passage, field_size:+(r.field_size||0)||null,
      source:r.source||'netkeiba-memory'
    };
  }
  function isBeforeCurrentRace(row){
    const rd=raceDateFromUrl(document.getElementById('raceUrl')?.value||'');
    if(!rd)return true;
    const s=String(row?.date||'').replace(/[./]/g,'-');
    const m=s.match(/(20\\d{2})-(\\d{1,2})-(\\d{1,2})/);
    if(!m)return true;
    const k=+m[1]*10000+(+m[2])*100+(+m[3]);
    return k < +rd;
  }
  function applyHistoryToHorse(h,rows,via='memory'){
    const clean=(rows||[]).map(memoryRunToHistory).filter(Boolean).filter(x=>x.rank&&x.distance&&isBeforeCurrentRace(x));
    const uniq=[];const seen=new Set();
    for(const x of clean.sort((a,b)=>String(b.date).localeCompare(String(a.date)))){
      const k=[x.date,x.venue,x.surface,x.distance,x.rank].join('|');
      if(seen.has(k))continue;seen.add(k);uniq.push(x);if(uniq.length>=5)break;
    }
    if(!uniq.length)return false;
    h.history=uniq;
    h.histScores=scoreLocalHistory(h.history);h.histScores.available=true;
    h.netkeibaVia=via;h.netkeibaRejected=false;h.netkeibaError='';
    mergeNetkeibaWithJra(h);
    return true;
  }
  loadNetkeibaHistories=async function({silent=false,force=false}={}){
    if(!horses.length){if(!silent)status('histStatus','先にJRA出馬表を取り込んでください。',true);return {ok:0,total:0}}
    try{
      if(!silent)status('histStatus','保存済みnetkeiba過去走を読み込み中…');
      let memRows=[];
      try{
        const mem=await memoryApi('horse_memory',{names:horses.map(h=>h.name)});
        memRows=mem.rows||[];
      }catch(e){console.warn('horse memory history',e)}
      const mm=new Map(memRows.map(x=>[String(x.horse_name||'').trim(),x.memory_json||{}]));
      for(const h of horses){
        const runs=mm.get(String(h.name).trim())?.runs||[];
        if(runs.length)applyHistoryToHorse(h,runs,'supabase-netkeiba-cache');
      }
      const missing=horses.filter(h=>!(h.history||[]).length);
      if(missing.length){
        try{
          const fb=await nkFallback(missing.map(h=>h.name),document.getElementById('raceUrl').value);
          for(const rr of fb.results||[]){
            const h=horses.find(x=>x.name===rr.name);
            if(h&&rr.available&&Array.isArray(rr.history)&&rr.history.length){
              applyHistoryToHorse(h,rr.history,rr.via||'netkeiba-fallback');
              h.netkeibaUrl=rr.url||null;
            }
          }
        }catch(e){console.warn('netkeiba fallback',e)}
      }
      const stillMissing=horses.filter(h=>!(h.history||[]).length);
      if(stillMissing.length){
        try{
          const j=await api('import_histories',{names:stillMissing.map(h=>h.name),race_url:document.getElementById('raceUrl').value,target:{venue:document.getElementById('venue').value,distance:+document.getElementById('distance').value,going:document.getElementById('going').value}});
          for(const rr of j.results||[]){
            const h=horses.find(x=>x.name===rr.name);
            if(h&&Array.isArray(rr.history)&&rr.history.length)applyHistoryToHorse(h,rr.history,rr.via||'legacy-name-search');
          }
        }catch(e){console.warn('legacy netkeiba route',e)}
      }
      renderHorses();evalAll();
      const ok=horses.filter(h=>(h.history||[]).length).length;
      const totalRuns=horses.reduce((n,h)=>n+Math.min(5,(h.history||[]).length),0);
      const jraN=horses.filter(h=>(h.jra_history||[]).length).length;
      const fills=horses.reduce((n,h)=>n+(h.jraFillCount||0),0);
      document.getElementById('histCount').textContent='netkeiba '+ok+'/'+horses.length+'頭・合計'+totalRuns+'走 / JRA照合 '+jraN+'頭';
      if(!silent)status('histStatus','netkeiba '+ok+'/'+horses.length+'頭・合計'+totalRuns+'走を使用。JRA照合で'+fills+'項目を補完。');
      return {ok,total:horses.length,totalRuns};
    }catch(e){
      if(!silent)status('histStatus','netkeiba取得処理でエラー：'+(e.message||String(e)),true);
      renderHorses();
      return {ok:horses.filter(h=>(h.history||[]).length).length,total:horses.length,error:e};
    }
  };

  mergedCareerStats=function(){
    const m=syncCareerRaceMapFromAudit();
    const rows=Object.values(m).filter(x=>x&&x.analyzed);
    const localA=rows.length,localV=rows.filter(x=>x.verified).length,localH=rows.filter(x=>x.verified&&x.hit).length;
    const remoteA=Number(memoryStats?.predictions||0),remoteV=Number(memoryStats?.verified_predictions||0),remoteH=Number(memoryStats?.hit_predictions||0);
    const useRemote=remoteA>0;
    const analyses=useRemote?remoteA:localA;
    const verified=useRemote?Math.min(analyses,remoteV):localV;
    const hits=useRemote?Math.min(verified,remoteH):localH;
    const merged={analyses,verified,hits,rate:verified?hits/verified*100:0,updated_at:new Date().toISOString()};
    careerStatsSave(merged);return merged;
  };

  // 枠順確定前の登録馬分析。独自分析だけで使用し、通常の出馬表取込は変更しない。
  const PREENTRY_API='https://qhzccahbevnqaoxdfnbx.supabase.co/functions/v1/jra-preentry-import';
  window.__preentryMode=false;
  async function preentryImport(url){
    const r=await fetch(PREENTRY_API,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    const j=await r.json().catch(()=>({error:'登録馬取込APIの応答を読み込めません'}));
    if(!r.ok)throw new Error(j.error||'登録馬取込エラー');
    return j;
  }
  function setupPreentryUI(){
    const raceInput=document.getElementById('raceUrl');
    const normalBtn=document.getElementById('importRace');
    if(!raceInput||!normalBtn||document.getElementById('importPreentry'))return;
    const btn=document.createElement('button');
    btn.className='secondary';btn.type='button';btn.id='importPreentry';btn.textContent='枠前分析';
    normalBtn.parentElement.appendChild(btn);
    const note=document.createElement('div');
    note.className='small';note.style.marginTop='8px';
    note.innerHTML='枠順・馬番が未確定なら、JRAの登録馬ページURLを入れて「枠前分析」。枠確定後は通常の「出馬表取込」で上書きします。';
    normalBtn.closest('.panel').insertBefore(note,document.getElementById('raceStatus'));
    normalBtn.addEventListener('click',()=>{window.__preentryMode=false},true);
    btn.addEventListener('click',async()=>{
      const url=raceInput.value.trim();
      if(!url){status('raceStatus','JRAの登録馬ページURLを入力してください。',true);return}
      try{
        status('raceStatus','枠前の登録馬を取得中…');
        const j=await preentryImport(url);
        window.__preentryMode=true;
        raceMeta={...(j.meta||{}),preentry:true};
        oddsCache={race_id:'',win:{},wide:{},trio:{},fetched_at:null};
        lastBetPlan=null;actual=[];
        horses=(j.horses||[]).map((h,i)=>({...h,no:i+1,provisional:true,history:[],histScores:null,jra_history:h.jra_history||[]}));
        if(j.meta?.race_name)document.getElementById('raceName').value=j.meta.race_name;
        if(j.meta?.venue)[...document.getElementById('venue').options].forEach(o=>o.selected=o.value===j.meta.venue);
        if(j.meta?.surface)[...document.getElementById('surface').options].forEach(o=>o.selected=o.value===j.meta.surface);
        if(j.meta?.distance){const d=String(j.meta.distance);[...document.getElementById('distance').options].forEach(o=>o.selected=o.value===d)}
        await loadMemoryForHorses();
        await loadNetkeibaHistories({silent:true,force:true});
        renderPaceReason();evalAll();renderHorses();
        const nkN=horses.filter(h=>(h.history||[]).length).length;
        const runN=horses.reduce((n,h)=>n+(h.history||[]).length,0);
        status('raceStatus','枠前分析：'+horses.length+'頭を取り込みました。<br>netkeiba '+nkN+'/'+horses.length+'頭・合計'+runN+'走<br>馬番・枠順・実オッズは未反映です。<br>枠確定後に通常の「出馬表取込」で正式データへ上書きします。');
      }catch(e){status('raceStatus',e.message||String(e),true)}
    });
  }
  const _generateTickets=generateTickets;
  generateTickets=function(){
    if(window.__preentryMode){
      evalAll();
      const box=document.getElementById('ticket');
      if(box)box.innerHTML='<div class="card" style="margin-top:10px"><b class="good">枠前分析</b><div class="small" style="margin-top:8px">ランキング分析までは実行済みです。馬番・枠順・実オッズ未確定のため、買い目は枠確定後に生成します。</div></div>';
      return [];
    }
    return _generateTickets();
  };
  const _savePredictionSnapshot=savePredictionSnapshot;
  savePredictionSnapshot=async function(mode='AI分析'){
    if(window.__preentryMode)return null;
    return _savePredictionSnapshot(mode);
  };
  const _recordAnalysisAudit=recordAnalysisAudit;
  recordAnalysisAudit=function(){if(window.__preentryMode)return;return _recordAnalysisAudit()};
  const _recordResultAudit=recordResultAudit;
  recordResultAudit=function(){if(window.__preentryMode)return false;return _recordResultAudit()};
  setupPreentryUI();
  <\/script>`;
  html=html.replace('</body>',patch+'</body>');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('boot').innerHTML='読み込みに失敗しました。<br>Safariを再読み込みしてください。<br><small>'+String(e)+'</small>'}
})();
</script>
</body>
</html>
