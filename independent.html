<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09101d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>KEIBA AI 独自分析</title>
<style>
html,body{margin:0;min-height:100%;background:#09101d;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
#boot{padding:120px 24px;text-align:center;line-height:1.7;color:#eef3ff}
#boot small{color:#9fb0cf}
</style>
</head>
<body>
<div id="boot">KEIBA AI 独自分析を読み込み中…<br><small>分析画面を準備しています</small></div>
<script>
(()=>{
  const BUILD='20260913-safari-loader-v363';
  const PATCHES=[
    './independent-patch.js?v=20260901-base7',
    './core-fix.js?v=20260902-core6',
    './result-url-support-v354.js?v=20260912-result-v354',
    './same-race-learning-guard-v357.js?v=20260912-same-race-v357',
    './independent-history-fix-v57.js?v=20260912-roster-odds-data1',
    './analysis-baseline-20260910-v358.js?v=20260913-baseline-v358',
    './course-score-correction-v360.js?v=20260913-course-v360',
    './nakayama-2200-shape-v334.js?v=20260912-restore-nk2200',
    './probability-normalization-v335.js?v=20260912-restore-prob335',
    './probability-model-v336.js?v=20260912-restore-prob336',
    './ranking-probability-separation-v337.js?v=20260912-restore-rankprob337',
    './comparison-probability-ranks-v338.js?v=20260912-restore-compranks338',
    './jra-going-engine-v341.js?v=20260912-restore-going341',
    './hanshin-2000-going-compat-v362.js?v=20260913-hanshin2000-v362b',
    './bet-strategy-v324.js?v=20260912-restore-bet324',
    './bet-wide-candidates-v323.js?v=20260912-restore-bet323',
    './bet-budget-promotion-v325.js?v=20260912-restore-bet325',
    './bet-selection-final-v351.js?v=20260912-final-v351',
    './bet-ticket-summary-v322.js?v=20260912-restore-bet322',
    './odds-market-refresh-v344.js?v=20260912-restore-heatfix344',
    './v345-observer-guard-v347.js?v=20260912-observer-v347',
    './restore-ui-data-course-v345.js?v=20260912-stable-v345',
    './ranking-stable-v356.js?v=20260912-ranking-v356',
    './comparison-stable-v359.js?v=20260913-comparison-v359',
    './ui-summary-stable-v350.js?v=20260912-stable-v350',
    './ios-render-fix-v355.js?v=20260912-render-v355'
  ];

  const safeText=s=>String(s??'').replace(/[<>]/g,'');
  const addInline=(code,label)=>{
    if(!code||!code.trim())return;
    const s=document.createElement('script');
    s.textContent=code+'\n//# sourceURL='+String(label||'keiba-inline.js').replace(/\s/g,'_');
    document.body.appendChild(s);
  };
  const fetchCode=async(src,ms=7000)=>{
    const ac=new AbortController();
    const timer=setTimeout(()=>ac.abort(),ms);
    try{
      const r=await fetch(src,{cache:'no-store',signal:ac.signal});
      if(!r.ok)throw new Error(src+' '+r.status);
      return await r.text();
    }catch(e){
      console.warn('patch skip',src,e);
      return '';
    }finally{clearTimeout(timer)}
  };
  const showFatal=e=>{
    document.documentElement.style.backgroundColor='#09101d';
    document.body.style.backgroundColor='#09101d';
    document.body.innerHTML='<div id="boot">読み込みに失敗しました。<br>Safariを再読み込みしてください。<br><small>'+safeText(e)+'</small></div>';
  };

  fetch('./v55-parts/part0.txt?v='+BUILD,{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('本体 '+r.status);return r.text()})
    .then(async html=>{
      html=html.replace(/KEIBA AI 独自分析 v\d+/g,'KEIBA AI 独自分析')
               .replace(/KEIBA_AI_Independent_v\d+/g,'KEIBA_AI_Independent_current');

      const parsed=new DOMParser().parseFromString(html,'text/html');
      const baseScripts=[...parsed.querySelectorAll('script')].map(s=>({src:s.getAttribute('src')||'',text:s.textContent||''}));
      parsed.querySelectorAll('script').forEach(s=>s.remove());

      document.head.innerHTML=parsed.head.innerHTML;
      document.body.innerHTML=parsed.body.innerHTML;
      document.documentElement.style.backgroundColor='#09101d';
      document.body.style.backgroundColor='#09101d';
      try{scrollTo(0,0)}catch(_){}

      for(const spec of baseScripts){
        if(spec.text.trim())addInline(spec.text,'part0-inline.js');
        else if(spec.src){
          const code=await fetchCode(spec.src);
          addInline(code,spec.src);
        }
      }

      const codes=await Promise.all(PATCHES.map(src=>fetchCode(src)));
      codes.forEach((code,i)=>addInline(code,PATCHES[i]));

      document.documentElement.dataset.app='ready';
      document.documentElement.dataset.build='safari-loader-v363';
      dispatchEvent(new Event('keiba-patches-ready'));
    })
    .catch(showFatal);
})();
</script>
</body>
</html>
