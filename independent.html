<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09101d">
<title>KEIBA AI 独自分析</title>
<style>html,body{margin:0;min-height:100%;background:#09101d;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}#boot{padding:120px 24px;text-align:center;line-height:1.7}</style>
</head>
<body>
<div id="boot">KEIBA AI 独自分析を読み込み中…</div>
<script>
(async()=>{
 try{
  const r=await fetch('./independent-v56.html?v=current-20260901-netkeiba-preentry',{cache:'no-store'});
  if(!r.ok)throw new Error('本体 '+r.status);
  let html=await r.text();
  html=html.replace(/KEIBA AI 独自分析 v\d+/g,'KEIBA AI 独自分析');
  const patch=`<script>
  const NETKEIBA_RACE_IMPORT='https://qhzccahbevnqaoxdfnbx.supabase.co/functions/v1/netkeiba-race-import';
  const __baseJraImport=jraImport;
  jraImport=async function(url){
    const s=String(url||'').trim();
    if(/netkeiba\\.com/i.test(s)){
      const r=await fetch(NETKEIBA_RACE_IMPORT,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:s})});
      const j=await r.json().catch(()=>({error:'netkeiba出馬表の応答を読み込めません'}));
      if(!r.ok)throw new Error(j.error||'netkeiba出馬表取込エラー');
      j.horses=(j.horses||[]).map((h,i)=>({...h,no:i+1,odds:null,jra_history:[],provisional:true}));
      j.meta={...(j.meta||{}),source:'netkeiba',provisional:true};
      return j;
    }
    return __baseJraImport(url);
  };
  setTimeout(()=>{
    const input=document.getElementById('raceUrl');
    if(input)input.placeholder='JRA または netkeiba のレースURL';
    const panel=input?.closest('.panel');
    const h2=panel?.querySelector('h2');
    if(h2)h2.textContent='出馬表・枠前分析';
    const note=panel?.querySelector('.small, .notice');
    if(panel&&!panel.querySelector('[data-netkeiba-note]')){
      const p=document.createElement('div');p.dataset.netkeibaNote='1';p.className='small';p.style.marginTop='8px';p.textContent='JRA出馬表がまだ無い場合は、netkeibaの出馬表URLをそのまま貼って「出馬表取込」で枠前分析できます。枠確定後にJRA出馬表で上書きします。';panel.appendChild(p);
    }
  },0);
  <\/script>`;
  html=html.replace('</body>',patch+'</body>');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('boot').innerHTML='読み込みに失敗しました。<br>Safariを再読み込みしてください。<br><small>'+String(e)+'</small>'}
})();
</script>
</body>
</html>
