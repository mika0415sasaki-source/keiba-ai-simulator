<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09101d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>KEIBA AI 独自分析</title>
<style>
html,body{margin:0;min-height:100%;background:#09101d;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
#boot{padding:120px 24px;text-align:center;line-height:1.7;color:#eef3ff}
#boot small{color:#9fb0cf}
</style>
</head>
<body>
<div id="boot">KEIBA AI 独自分析を読み込み中…<br><small>分析画面を準備しています</small></div>
<script>
(()=>{
  const PATCHES=[
    './sapporo-1800-eval-v249.js?v=20260908-summary319',
    './sapporo-1800-profile-v248.js?v=20260908-summary319',
    './hanshin-1200-profile-v276.js?v=20260908-summary319',
    './nakayama-2000-profile-v282.js?v=20260908-summary319',
    './bet-profit-guard-v265.js?v=20260908-summary319',
    './bet-safety-net-v287.js?v=20260908-summary319',
    './mobile-history-ui-fix-v288.js?v=20260908-summary319',
    './authoritative-import-v296.js?v=20260908-summary319',
    './newspaper-style-history-v297.js?v=20260908-summary319',
    './grade-detail-score-v298.js?v=20260908-summary319',
    './history-resilience-v299.js?v=20260908-summary319',
    './grade-missing-guard-v299.js?v=20260908-summary319',
    './detail-accuracy-mobile-v300.js?v=20260908-summary319',
    './career-quality-consistency-v301.js?v=20260908-summary319',
    './analysis-history-market-ui-v302.js?v=20260908-summary319',
    './analysis-consistency-v303.js?v=20260908-summary319',
    './recent-sectional-context-v305.js?v=20260908-summary319',
    './analysis-compact-v306.js?v=20260908-summary319',
    './marked-ticket-consistency-v307.js?v=20260908-summary319',
    './bet-strategy-v315.js?v=20260908-summary319',
    './bet-stake-rebalance-v317.js?v=20260908-summary319',
    './bet-ticket-summary-v318.js?v=20260908-summary319'
  ];
  const addInline=code=>{if(!code||!code.trim())return;const s=document.createElement('script');s.textContent=code;document.body.appendChild(s)};
  const fetchCode=async(src,ms=5000)=>{const ac=new AbortController();const timer=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(src,{cache:'no-store',signal:ac.signal});return r.ok?await r.text():''}catch(e){console.warn('patch skip',src,e);return''}finally{clearTimeout(timer)}};
  const lock=()=>{const a=document.getElementById('importRace'),h=document.getElementById('importHist');if(a){a.disabled=true;a.textContent='準備中…'}if(h)h.disabled=true};
  const unlockFallback=()=>{const a=document.getElementById('importRace'),h=document.getElementById('importHist');if(a&&!['v296','v297'].includes(document.documentElement.dataset.importController||'')){a.disabled=false;a.textContent='出馬表取込'}if(h&&!['v296','v297'].includes(document.documentElement.dataset.importController||'')){h.disabled=false;h.textContent='過去5走を再取得'}};
  fetch('./v55-parts/part0.txt?v=20260908-summary319',{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('本体 '+r.status);return r.text()})
    .then(async html=>{
      html=html.replace(/KEIBA AI 独自分析 v\d+/g,'KEIBA AI 独自分析').replace(/KEIBA_AI_Independent_v\d+/g,'KEIBA_AI_Independent_current');
      const parsed=new DOMParser().parseFromString(html,'text/html');
      const baseScripts=[...parsed.querySelectorAll('script')].map(s=>({src:s.getAttribute('src')||'',text:s.textContent||''}));parsed.querySelectorAll('script').forEach(s=>s.remove());
      document.head.innerHTML=parsed.head.innerHTML;document.body.innerHTML=parsed.body.innerHTML;document.documentElement.style.backgroundColor='#09101d';document.body.style.backgroundColor='#09101d';try{scrollTo(0,0)}catch(_){}
      for(const spec of baseScripts){if(spec.text.trim())addInline(spec.text);else if(spec.src)addInline(await fetchCode(spec.src))}
      lock();const codes=await Promise.all(PATCHES.map(x=>fetchCode(x)));codes.forEach(addInline);
      document.documentElement.dataset.app='ready';document.documentElement.dataset.build='summary319';dispatchEvent(new Event('keiba-patches-ready'));setTimeout(unlockFallback,0);
    })
    .catch(e=>{document.documentElement.style.backgroundColor='#09101d';document.body.style.backgroundColor='#09101d';document.body.innerHTML='<div id="boot">読み込みに失敗しました。<br>再読み込みしてください。<br><small>'+String(e).replace(/[<>]/g,'')+'</small></div>'});
})();
</script>
</body>
</html>
