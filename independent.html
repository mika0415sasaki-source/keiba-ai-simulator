 try{

  if(!r.ok)throw new Error('本体 '+r.status);
  let html=await r.text();
  html=html.replace(/KEIBA AI 独自分析 v\d+/g,'KEIBA AI 独自分析')
           .replace(/KEIBA_AI_Independent_v\d+/g,'KEIBA_AI_Independent_current');

            '<scr'+'ipt src="./core-fix.js?v=20260902-core3"></scr'+'ipt>';
  html=html.replace('</body>',tag+'</body>');
  document.open();
  document.write(html);
  document.close();
 }catch(e){
  document.getElementById('boot').innerHTML='読み込みに失敗しました。<br>Safariを再読み込みしてください。<br><small>'+String(e)+'</small>';
 }
})();
